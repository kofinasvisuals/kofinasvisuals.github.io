<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KOFINAS VISUALS — Visual Production</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #080808;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 55px;
            overflow: hidden;
        }

        .hero-image {
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,0.72),
                    rgba(0,0,0,0.20)
                ),
                url("https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=2400&q=90")
                center / cover;

            transform: scale(1.02);
        }

        .top {
            position: absolute;
            top: 40px;
            left: 55px;
            right: 55px;

            display: flex;
            justify-content: space-between;

            z-index: 2;
        }

        .by {
            font-size: 10px;
            letter-spacing: 4px;
            opacity: 0.65;
        }

        .menu {
            font-size: 10px;
            letter-spacing: 4px;
            opacity: 0.65;
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 1100px;
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 5px;
            margin-bottom: 25px;
            opacity: 0.65;
        }

        h1 {
            font-size: clamp(60px, 11vw, 165px);
            line-height: 0.82;
            letter-spacing: -7px;
            font-weight: 700;
        }

        .descriptor {
            margin-top: 32px;

            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;

            opacity: 0.75;
        }

        .bottom {
            position: absolute;
            right: 55px;
            bottom: 55px;

            z-index: 2;

            writing-mode: vertical-rl;

            font-size: 9px;
            letter-spacing: 4px;
            opacity: 0.55;
        }

        @media (max-width: 700px) {

            .hero {
                padding: 30px;
            }

            .top {
                top: 30px;
                left: 30px;
                right: 30px;
            }

            .menu {
                display: none;
            }

            h1 {
                font-size: clamp(55px, 16vw, 100px);
                letter-spacing: -4px;
            }

            .descriptor {
                font-size: 9px;
                letter-spacing: 3px;
                line-height: 1.8;
                max-width: 280px;
            }

            .bottom {
                right: 25px;
                bottom: 30px;
            }
        }
    </style>
</head>

<body>

    <main class="hero">

        <div class="hero-image"></div>

        <header class="top">
            <div class="by">
                BY TRAVELFILMGR
            </div>

            <div class="menu">
                MENU
            </div>
        </header>

        <section class="content">

            <div class="eyebrow">
                VISUAL PRODUCTION
            </div>

            <h1>
                KOFINAS<br>
                VISUALS
            </h1>

            <div class="descriptor">
                Photography · Real Estate · Events
            </div>

        </section>

        <div class="bottom">
            SCROLL TO EXPLORE
        </div>

    </main>

</body>
</html>
