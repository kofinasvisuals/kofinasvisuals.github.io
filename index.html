<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KOFINAS VISUALS — Visual Production</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #080808;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 42px 50px;
            position: relative;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
            z-index: 2;
        }

        .brand-small {
            font-size: 11px;
            letter-spacing: 4px;
            opacity: 0.65;
        }

        .status {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.55;
        }

        .center {
            position: relative;
            z-index: 2;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 5px;
            opacity: 0.55;
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(55px, 11vw, 160px);
            line-height: 0.82;
            letter-spacing: -7px;
            font-weight: 700;
        }

        .descriptor {
            margin-top: 35px;
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .construction {
            margin-top: 55px;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .line {
            width: 55px;
            height: 1px;
            background: rgba(255,255,255,0.5);
        }

        .construction span {
            font-size: 10px;
            letter-spacing: 4px;
            opacity: 0.5;
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            position: relative;
            z-index: 2;
        }

        .location {
            font-size: 10px;
            letter-spacing: 3px;
            opacity: 0.4;
            text-transform: uppercase;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 9px;
            letter-spacing: 3px;
            opacity: 0.45;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: white;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .background-number {
            position: absolute;
            right: 35px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28vw;
            font-weight: 700;
            line-height: 1;
            color: rgba(255,255,255,0.025);
            user-select: none;
        }

        @media (max-width: 700px) {

            .page {
                padding: 30px;
            }

            .top {
                align-items: center;
            }

            .status {
                display: none;
            }

            h1 {
                letter-spacing: -4px;
            }

            .descriptor {
                font-size: 10px;
                letter-spacing: 3px;
                line-height: 1.8;
                max-width: 250px;
            }

            .construction {
                margin-top: 40px;
            }

            .bottom {
                align-items: flex-end;
            }

            .location {
                font-size: 8px;
            }

            .background-number {
                right: -10px;
                font-size: 45vw;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="background-number">01</div>

        <header class="top">
            <div class="brand-small">
                BY TRAVELFILMGR
            </div>

            <div class="status">
                New website
            </div>
        </header>


        <section class="center">

            <div class="eyebrow">
                VISUAL PRODUCTION
            </div>

            <h1>
                KOFINAS<br>
                VISUALS
            </h1>

            <div class="descriptor">
                Photography · Real Estate · Events
            </div>

            <div class="construction">
                <div class="line"></div>
                <span>WEBSITE UNDER CONSTRUCTION</span>
            </div>

        </section>


        <footer class="bottom">

            <div class="location">
                Greece · 2026
            </div>

            <div class="loading">
                <div class="dot"></div>
                <span>COMING SOON</span>
            </div>

        </footer>

    </main>

</body>
</html>
